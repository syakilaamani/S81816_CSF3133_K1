<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Form Page</title>
    </head>
    <body>
        <h2>Registration Form</h2>
        <form action="submit_form.php" method="post">
            <label for="fname">First Name:</label><br>
            <input type="text" id="fname" name="firstname"><br><br>

            <label for="lname">Last Name:</label><br>
            <input type="text" id="lname" name="lastname"><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
                <br><br>
            <input type="submit" value="Submit">
        </form>
        <form action="submit_form.php" method="post"><br>
            <label for="hobby">Select your hobbies:</label><br>
            <input type="checkbox" id="hobby1" name="hobby1" value="Reading">
            <label for="hobby1">Reading</label><br>
            <input type="checkbox" id="hobby2" name="hobby2" value="Gaming">
            <label for="hobby2">Gaming</label><br><br>
            
            <label for="country">Choose a country:</label>
            <select id="country" name="country">
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
            </select><br><br>    
        </form>
    </body>
</html>
