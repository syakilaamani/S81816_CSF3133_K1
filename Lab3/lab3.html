<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My Contact Website</title>
    </head>
    <body>
        <div id="header">
            <h1>My Contact Website</h1>
            <span>Get in touch with us!</span>
        </div>
        <hr>

        <div id="content">
            <h2>Contact Form</h2>
            <form action="">
                <label>Email:</label>
                <input type="email" name="email" placeholder="Enter your email" required>
                <br><br>

                <label>Preferred Content Date:</label>
                <input type="date" name="contactDate" required>
                <br><br>

                <label>Satisfaction Level:</label>
                <input type="range" name="satisfaction" min="0" max="10" value="5">
                <br><br>
                <input type="submit" value="Submit">
            </form>

            <hr>

            <h2>Simple Calculator</h2>

            <form oninput="total.value = Number(num1.value) + Number(num2.value)">

                <label>First Number:</label>
                <input type="number" id="num1" value="0">
                <br><br>

                <label>Second Number:</label>
                <input type="number" id="num2" value="0">
                <br><br>

                <label>Total:</label>
                <output name="total" for="num1 num2">0</output>
                <br><br>
            </form>
        </div>

        <hr>

        <div id="footer">
            <h3>Contact Information</h3>
            <p>Email: </p>
            <p>Phone: 012-88546932</p>
            <p>&copy; 2026 My Contact Website</p>
        </div>
    </body>
</html>
